[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alertweave"
version = "0.1.0"
description = "Groups SOC alerts into incidents through shared entities weighted by rarity."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "alertweave contributors" }]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "typer>=0.12"]
keywords = ["siem", "alert-correlation", "incident-clustering", "security-operations"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
alertweave = "alertweave.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alertweave"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff.lint.isort]
known-first-party = ["alertweave", "conftest"]
